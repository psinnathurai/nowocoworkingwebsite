<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
.avail-badge { display: inline-flex; align-items: center; gap: 8px; }
.avail-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.avail-text { font-size: 13px; letter-spacing: 0.02em; color: var(--color-text); white-space: nowrap; }

</style>
</helmet>
<sc-if value="{{ hasData }}" hint-placeholder-val="{{ false }}">
  <span class="avail-badge" title="{{ title }}">
    <span class="avail-dot" style="background: {{ dotColor }}"></span>
    <span class="avail-text">{{ label }}</span>
  </span>
</sc-if>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { data: null };

  componentDidMount() {
    this.fetchAvailability();
    this._interval = setInterval(() => this.fetchAvailability(), 60000);
  }

  componentWillUnmount() {
    clearInterval(this._interval);
  }

  fetchAvailability() {
    fetch("https://nowocoworkingspace-dkcscqdjdsbnhveu.westeurope-01.azurewebsites.net/api/availability")
      .then(res => { if (!res.ok) throw new Error("bad response"); return res.json(); })
      .then(data => {
        if (data && typeof data.free === "number") this.setState({ data });
      })
      .catch(() => {
        if (!this.state.data) this.setState({ data: { checked_in: 2, total: 13, free: 11 } });
      });
  }

  renderVals() {
    const data = this.state.data;
    const hasData = !!data;
    const free = hasData ? data.free : 0;
    const isFree = free > 0;
    return {
      hasData,
      dotColor: isFree ? "#2E7D46" : "#C0392B",
      label: isFree ? (free + " Plätze frei") : "Ausgebucht",
      title: hasData ? (data.checked_in + " von " + data.total + " belegt") : ""
    };
  }
}

</script>
</body>
</html>
